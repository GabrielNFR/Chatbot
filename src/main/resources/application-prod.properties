# ============================================================
# Perfil de PRODUCAO
# Ativar com: SPRING_PROFILES_ACTIVE=prod
# ============================================================

# --- Servidor ---
# Provedores e plataformas (App Runner, Elastic Beanstalk, ECS) injetam a
# porta pela variavel PORT. Sem isso a aplicacao sobe na porta errada.
server.port=${PORT:8080}
# Respeita os cabecalhos X-Forwarded-* quando atras de load balancer/proxy.
server.forward-headers-strategy=framework

# --- JPA / Hibernate ---
# NUNCA logar SQL em producao: polui os logs e pode expor dados pessoais
# (requisito nao-funcional de privacidade da especificacao).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Schema: mantido 'update' para nao quebrar ambientes novos.
# Apos migrar para Flyway/Liquibase, troque para 'validate' (recomendado):
#   spring.jpa.hibernate.ddl-auto=validate
# Sobrescrevivel por variavel de ambiente durante a transicao.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# --- Actuator / Health check ---
# Necessario para o health check do load balancer / da plataforma.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# Nao expor detalhes (banco, disco, etc.) publicamente.
management.endpoint.health.show-details=never

# --- Logs ---
logging.level.root=INFO
