name: CI

on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Garantir permissao de execucao do Maven Wrapper
        run: chmod +x mvnw

      - name: Rodar testes
        run: ./mvnw -B verify

      - name: Publicar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: chatbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publicar:
    name: Merge na main
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref_name != 'main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Abrir PR e fazer merge (dispara o deploy)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh pr create --repo "$REPO" --base main --head "$BRANCH" \
            --title "$(git log -1 --pretty=%s)" \
            --body "Merge automatico apos CI verde." 2>/dev/null || echo "PR ja existente."

          mergeado=false
          for tentativa in 1 2 3 4 5 6; do
            if gh pr merge "$BRANCH" --repo "$REPO" --squash --delete-branch; then
              mergeado=true
              break
            fi
            echo "Tentativa $tentativa nao concluiu; aguardando 5s..."
            sleep 5
          done

          if [ "$mergeado" != "true" ]; then
            echo "Nao foi possivel mergear a PR."
            exit 1
          fi

          for branch in $(gh api "repos/$REPO/branches?per_page=100" --jq '.[].name'); do
            if [ "$branch" = "main" ] || [ "$branch" = "$BRANCH" ]; then
              continue
            fi

            estado=$(gh pr list --repo "$REPO" --head "$branch" --state all \
              --json state --jq '.[0].state // "SEM_PR"')

            if [ "$estado" = "MERGED" ]; then
              gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null
              echo "Branch remota removida: $branch"
            fi
          done
